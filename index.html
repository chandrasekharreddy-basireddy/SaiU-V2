<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="SaiU V2 — a smart, offline-first university life operating system.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://docs.google.com https://hivelabs.app.n8n.cloud https:;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>SaiU V2</title>
</head>
<body>
  <div id="app" class="shell">
    <header class="topbar">
      <button type="button" class="brand" data-view="home" aria-label="SaiU home"><span class="brand-mark">S</span><span>SaiU <b>V2</b></span></button>
      <div class="top-actions"><button type="button" id="installBtn" class="ghost hidden">Install</button><button type="button" id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button></div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" data-view="home">⌂<span>Home</span></button>
      <button type="button" data-view="timetable">▦<span>Timetable</span></button>
      <button type="button" data-view="ai">✦<span>Ask AI</span></button>
      <button type="button" data-view="planner">✓<span>Planner</span></button>
      <button type="button" data-view="more">•••<span>More</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div><button type="button" id="modalClose" class="modal-close">Close</button></dialog>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
