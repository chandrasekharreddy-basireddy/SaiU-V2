<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="SaiU V2 — a smart, offline-first university life operating system.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b1020'/%3E%3Ctext x='50' y='67' text-anchor='middle' font-size='55' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <title>SaiU V2</title>
</head>
<body>
  <div id="app" class="shell">
    <header class="topbar">
      <button class="brand" data-view="home" aria-label="SaiU home"><span class="brand-mark">S</span><span>SaiU <b>V2</b></span></button>
      <div class="top-actions"><button id="installBtn" class="ghost hidden">Install</button><button id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button></div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="home">⌂<span>Home</span></button>
      <button data-view="timetable">▦<span>Timetable</span></button>
      <button data-view="ai">✦<span>Ask AI</span></button>
      <button data-view="planner">✓<span>Planner</span></button>
      <button data-view="more">•••<span>More</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div><button class="modal-close" onclick="this.closest('dialog').close()">Close</button></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
