name: SaiU V2 Live Data Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-data-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax
        run: node --check tests/live-source.mjs
      - name: Fetch and validate published timetable
        run: node tests/live-source.mjs
