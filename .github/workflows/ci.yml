name: SaiU V2 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
      - name: Run full source validation
        run: npm run check
      - name: Validate critical modules
        run: node --check js/catalog.js && node --check js/remote.js && grep -q 'serviceWorker' js/bootstrap.js && grep -q 'start_url' manifest.json
