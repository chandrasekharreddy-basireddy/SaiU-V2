name: SaiU V2 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
      - name: Validate required PWA files
        run: test -f index.html && test -f manifest.json && test -f sw.js && test -f styles.css
      - name: Validate critical modules
        run: node --check js/catalog.js && node --check js/remote.js && grep -q 'serviceWorker' index.html && grep -q 'start_url' manifest.json
