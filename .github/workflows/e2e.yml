name: SaiU V2 Browser E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-e2e
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npx --yes @playwright/test@1.62.1 install --with-deps chromium
      - name: Run browser E2E
        run: npx --yes @playwright/test@1.62.1 test
