name: SaiU V2 Production Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production:
    name: Production validation + artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify runtime
        run: node --version && npm --version

      - name: Run full automated tests
        run: npm test

      - name: Run full syntax + source checks
        run: npm run check

      - name: Validate production files
        shell: bash
        run: |
          set -euo pipefail
          required=(index.html manifest.json styles.css sw.js package.json README.md SECURITY.md)
          for file in "${required[@]}"; do
            test -f "$file"
          done
          node -e "const m=require('./manifest.json'); if(!m.name||!m.start_url||!m.display) process.exit(1)"
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})' --exclude-dir=.git .

      - name: Build immutable release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp -R index.html styles.css manifest.json sw.js js docs README.md SECURITY.md release/
          tar -czf saiu-v2-production.tar.gz -C release .
          sha256sum saiu-v2-production.tar.gz > saiu-v2-production.sha256

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: saiu-v2-production-${{ github.sha }}
          path: |
            saiu-v2-production.tar.gz
            saiu-v2-production.sha256
          if-no-files-found: error
          retention-days: 30
